<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Unit Converter</title>
</head>
<body>
    <section id="number-hero" class="flex flex-col items-center justify-center pt-8 pb-8">
        <h1 class="font-white">Metric/Imperial Unit Conversion</h1>
        <input type="number" id="number-input" class="mt-6">
    </section>

    <section>
        <div id="length">
            <h3>Length (Meter/Feet)</h3>
            <p><span class="input-value"></span> meters = <span id="feet-el"></span> feet | <span class="input-value"></span> feet = <span id="meters-el"></span> meters</p>
        </div>
        <div id="volume">
            <h3>Volume (Liters/Gallons)</h3>
            <p><span class="input-value"></span> gallons = <span id="liters-el"></span> liters | <span class="input-value"></span> liters = <span id="gallons-el"></span> gallons</p>
        </div>
        <div id="mass">
            <h3>Mass (Kilograms/Pounds)</h3>
            <p><span class="input-value"></span> pounds = <span id="kilograms-el"></span> kilograms| <span class="input-value"></span> kilograms = <span id="pounds-el"></span> pounds</p>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
